name: Abweichung zu e-Rechnung.gv.at
description: Das Portal (oder der Test-Upload) urteilt anders als EbInterface.Net.
title: "Abweichung: "
labels: ["portal-abweichung"]
body:
  - type: markdown
    attributes:
      value: |
        Danke! Solche Rückmeldungen halten die Regeln aktuell.
        **Bitte keine echten Rechnungsdaten** – Namen, UID-Nummern, IBANs und Beträge durch erfundene Werte ersetzen.
  - type: dropdown
    id: richtung
    attributes:
      label: Was ist passiert?
      options:
        - Das Portal lehnt ab, EbInterface.Net meldet keinen Fehler
        - EbInterface.Net meldet einen Fehler, das Portal nimmt die Rechnung an
        - Beide lehnen ab, aber mit unterschiedlichem Grund
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: ebInterface-Version
      options: ["6.1", "6.0", "5.0", "4.3"]
    validations:
      required: true
  - type: input
    id: bibliothek
    attributes:
      label: Version von EbInterface.Net
      placeholder: z. B. 0.1.0-alpha
    validations:
      required: true
  - type: textarea
    id: portal
    attributes:
      label: Meldung des Portals
      description: Fehlercodes und Text, z. B. „[AF-0028] Der angegebene Wert ist ungültig …“
      render: text
    validations:
      required: true
  - type: textarea
    id: bibliothek-meldung
    attributes:
      label: Meldungen von EbInterface.Net
      description: Ausgabe von `result.Messages` (Profil `ERechnungGvAt`)
      render: text
  - type: input
    id: datum
    attributes:
      label: Datum der Prüfung am Portal
      placeholder: z. B. 2026-10-01
    validations:
      required: true
  - type: textarea
    id: xml
    attributes:
      label: Gekürztes Beispiel-XML (synthetisch)
      description: Nur die Teile, die für die Abweichung nötig sind.
      render: xml
