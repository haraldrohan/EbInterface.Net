# Hält GitHub Actions und NuGet-Pakete (nur Test- und Build-Werkzeuge; die Bibliothek hat keine Abhängigkeiten) aktuell.
# Das Submodule mit den Schemas wird bewusst NICHT automatisch aktualisiert (siehe CLAUDE.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Große Sprünge der .NET-Laufzeitpakete erst übernehmen, wenn das MCP-SDK (ModelContextProtocol) dazu passt –
      # Hosting 11 mit MCP-SDK 2.4 (gebaut gegen System.Text.Json 10) brach den MCP-Server (PR #11, November 2026).
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
    groups:
      test-tools:
        patterns: ["*"]
